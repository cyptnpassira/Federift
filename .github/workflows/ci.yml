name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.9", "3.11", "3.12" ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Byte-compile the package
        run: python -m compileall -q federift
      - name: Smoke-run every bundled scenario
        run: |
          for s in federift/scenarios/*.json; do
            echo "=== $s ==="
            python -m federift run "$s"
            python -m federift partition "$s"
          done

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Build & vet
        working-directory: topology
        run: |
          go build ./...
          go vet ./...
      - name: Simulate a scenario
        working-directory: topology
        run: go run ./cmd/topology -scenario ../federift/scenarios/fractured-robust.json

  pipeline:
    runs-on: ubuntu-latest
    needs: [ python, go ]
    steps:
      - uses: actions/checkout@v4
