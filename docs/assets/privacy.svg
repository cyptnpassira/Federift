<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="monospace" role="img" aria-label="Animated chart of convergence and privacy noise trade-off">
  <title>federift: privacy / convergence trade-off</title>
  <desc>Two animated traces: a convergence curve descending toward the client targets, and a leakage-signal band that shrinks as differential-privacy noise increases.</desc>

  <defs>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1720"/>
      <stop offset="100%" stop-color="#070c12"/>
    </linearGradient>
    <linearGradient id="leak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <rect width="720" height="340" fill="url(#pane)"/>
  <text x="24" y="34" fill="#7dd3fc" font-size="17" letter-spacing="1">privacy ↔ convergence</text>
  <text x="24" y="53" fill="#3f6076" font-size="11">higher σ (DP noise) → lower leakage signal, slower convergence · APPROXIMATE</text>

  <!-- axes -->
  <g stroke="#243447" stroke-width="1">
    <line x1="70" y1="90" x2="70" y2="290"/>
    <line x1="70" y1="290" x2="680" y2="290"/>
  </g>
  <g fill="#3f6076" font-size="10">
    <text x="36" y="96">hi</text>
    <text x="36" y="290">lo</text>
    <text x="70" y="308">round 0</text>
    <text x="640" y="308">round N</text>
  </g>

  <!-- gridlines -->
  <g stroke="#131f2b" stroke-width="1">
    <line x1="70" y1="140" x2="680" y2="140"/>
    <line x1="70" y1="190" x2="680" y2="190"/>
    <line x1="70" y1="240" x2="680" y2="240"/>
  </g>

  <!-- leakage band (shrinks over time as DP noise dominates) -->
  <path d="M70,150 L680,150 L680,290 L70,290 Z" fill="url(#leak)">
    <animate attributeName="d"
      values="M70,150 L680,150 L680,290 L70,290 Z;
              M70,150 L680,250 L680,290 L70,290 Z;
              M70,150 L680,150 L680,290 L70,290 Z"
      dur="7s" repeatCount="indefinite"/>
  </path>
  <text x="360" y="272" fill="#fca5a5" font-size="10" text-anchor="middle" opacity="0.8">leakage signal (heuristic)</text>

