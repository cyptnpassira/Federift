[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "federift"
version = "0.5.0"
description = "Educational federated-learning network and privacy simulator (Python core + Go topology engine)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Federift contributors" }]
keywords = ["federated-learning", "simulation", "differential-privacy", "education", "networking"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Education",
]
dependencies = []

[project.urls]
Homepage = "https://example.invalid/federift"
Repository = "https://example.invalid/federift"
Changelog = "https://example.invalid/federift/blob/main/CHANGELOG.md"

